<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <base href="https://cdn.jsdelivr.net/gh/hyperfrog7/astral@main/" />
        <title>Astral</title>
        <link rel="icon" type="image/svg+xml" href="logo.svg" />
        <style>
            :root {
                --bg-primary: #0d1b2a;
                --bg-secondary: #152238;
                --bg-surface: #1b263b;
                --border: #415a77;
                --text-secondary: #778da9;
                --text-primary: #e0e1dd;
                --accent: #cba6f7;
            }

            html,
            body {
                background-color: var(--bg-primary);
                font-family: "Maple Mono", monospace;
                color: var(--text-primary);
                margin: 0px;
                padding: 0px;
            }

            .navbar {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                background-color: var(--bg-surface);
                border-bottom: 2px solid var(--border);
                padding: 12px 24px;
            }

            .navbar-start {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .navbar-start h1 {
                margin: 0;
                line-height: 1;
            }

            .navbar-center {
                display: flex;
                justify-content: center;
                justify-self: center;
                width: 100%;
                height: 100%;
            }

            .navbar-search {
                display: flex;
                align-items: center;
                gap: 8px;
                background-color: var(--bg-secondary);
                border: 2px solid var(--border);
                border-radius: 8px;
                padding: 6px 12px;
                min-width: 500px;
            }

            #search-input {
                flex: 1;
                background: transparent;
                border: none;
                outline: none;
                color: var(--text-primary);
                font-family: inherit;
            }

            #search-input::placeholder {
                color: var(--text-secondary);
                opacity: 1;
            }

            #search-icon {
                width: 24px;
                height: 24px;
            }

            #category-select {
                background-color: var(--bg-surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text-primary);
                font-family: inherit;
                font-size: 0.85rem;
                font-weight: 500;
                padding: 6px 10px;
                outline: none;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            #category-select:hover {
                border-color: var(--accent);
                background-color: var(--bg-primary);
            }

            #category-select option {
                background-color: var(--bg-surface);
                color: var(--text-primary);
            }

            .navbar-end {
                display: flex;
                justify-content: flex-end;
            }

            #settings-icon {
                width: 24px;
                height: 24px;
                cursor: pointer;
            }

            #game-grid {
                display: block;
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
                padding: 24px;
                box-sizing: border-box;
            }

            .no-results {
                text-align: center;
                color: var(--text-secondary);
                font-size: 1.1rem;
                padding: 40px 0;
            }

            .category-section {
                width: 100%;
                margin-bottom: 2rem;
            }

            .category-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background-color: var(--bg-surface);
                border: 1px solid var(--border);
                color: var(--text-primary);
                padding: 12px 18px;
                border-radius: 8px;
                cursor: pointer;
                user-select: none;
                font-weight: 600;
                font-size: 1.1rem;
                transition:
                    background-color 0.2s ease,
                    border-color 0.2s ease;
            }

            .category-header:hover {
                background-color: var(--bg-secondary);
                border-color: var(--accent);
            }

            .category-header .toggle-icon {
                color: var(--accent);
                font-weight: bold;
                font-size: 1.2rem;
                line-height: 1;
                transition: transform 0.2s ease;
            }

            .category-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 1rem;
                padding-top: 1rem;
            }

            .category-grid.collapsed {
                display: none !important;
            }

            .game-card {
                background-color: var(--bg-surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                overflow: hidden;
                cursor: pointer;
                display: flex;
                flex-direction: column;
                padding: 8px;
                text-decoration: none;
                color: inherit;
                transition:
                    transform 0.2s ease,
                    border-color 0.2s ease,
                    box-shadow 0.2s ease;
            }

            .game-card:hover {
                transform: translateY(-4px);
                border-color: var(--accent);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            }

            .game-icon {
                width: 100%;
                aspect-ratio: 1 / 1;
                object-fit: cover;
                border-radius: 8px;
            }

            .game-title {
                margin-top: 10px;
                margin-bottom: 4px;
                font-size: 0.95rem;
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .game-modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(13, 27, 42, 0.95);
                z-index: 9999;
                display: flex;
                flex-direction: column;
            }

            .game-modal.hidden {
                display: none !important;
            }

            .game-modal-header {
                width: 100%;
                height: 50px;
                background-color: var(--bg-surface);
                box-sizing: border-box;
                padding: 0 16px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }

            .game-modal-title {
                color: var(--text-primary);
                font-weight: 600;
                font-size: 1rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                margin: 0;
            }

            .game-modal-controls {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-left: auto;
            }

            .game-modal-controls button {
                background-color: var(--bg-secondary);
                border: 1px solid var(--border);
                color: var(--text-primary);
                font-size: 0.85rem;
                font-weight: 500;
                padding: 6px 12px;
                border-radius: 6px;
                cursor: pointer;
                transition: all 0.2s ease;
                font-family: inherit;
            }

            .game-modal-controls button:hover {
                background-color: var(--accent);
                color: var(--bg-primary);
                border-color: var(--accent);
            }

            .game-modal-controls button.close-btn:hover {
                background-color: #ef4444;
                color: #ffffff;
                border-color: #ef4444;
            }

            #game-frame {
                flex: 1;
                width: 100%;
                height: calc(100vh - 50px);
                border: none;
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="navbar-start">
                <img width="48" height="48" src="logo.svg" />
                <h1 class="title">Astral</h1>
            </div>
            <div class="navbar-center">
                <div class="navbar-search">
                    <img id="search-icon" src="images/search.svg" />
                    <input
                        id="search-input"
                        type="text"
                        placeholder="Search..."
                        oninput="searchGames()"
                    />
                    <div id="categoryDropdown">
                        <select
                            id="category-select"
                            onchange="changeCategory()"
                        >
                            <option value="all">All games</option>
                            <option value="astral">Astral</option>
                            <option value="gn-math">GN-Math</option>
                            <option value="ugs">UGS</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="navbar-end">
                <img
                    id="settings-icon"
                    src="images/settings.svg"
                    onclick="openSettings()"
                />
            </div>
        </div>

        <main class="game-grid" id="game-grid"></main>

        <div id="game-modal" class="game-modal hidden">
            <div class="game-modal-header">
                <span id="game-modal-title" class="game-modal-title"
                    >Game Title</span
                >
                <div class="game-modal-controls">
                    <button id="fullscreen-btn">Fullscreen</button>
                    <button id="download-btn">Download</button>
                    <button id="close-btn" class="close-btn">Close</button>
                </div>
            </div>
            <iframe
                id="game-frame"
                src=""
                frameborder="0"
                allowfullscreen
            ></iframe>
        </div>

        <script>
            let allGames = [];
            let activeGameFile = "";

            function getCategoryKey(game) {
                const filePath = game.file || game.url || "";
                if (filePath.indexOf("games/gn-math/") !== -1) return "GN-Math";
                if (filePath.indexOf("games/ugs/") !== -1) return "UGS";
                return "Astral";
            }

            function groupGamesByCategory(gamesList) {
                const groups = {};
                gamesList.forEach((game) => {
                    const cat = getCategoryKey(game);
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(game);
                });
                return groups;
            }

            function updateCategoryDropdown() {
                const categorySelect =
                    document.getElementById("category-select");
                if (!categorySelect) return;

                const grouped = groupGamesByCategory(allGames);

                const astralCount = (grouped["Astral"] || []).length;
                const gnMathCount = (grouped["GN-Math"] || []).length;
                const ugsCount = (grouped["UGS"] || []).length;

                categorySelect.innerHTML = `
            <option value="all">All (${allGames.length})</option>
            <option value="astral">Astral (${astralCount})</option>
            <option value="gn-math">GN-Math (${gnMathCount})</option>
            <option value="ugs">UGS (${ugsCount})</option>
          `;
            }

            function renderCategorizedGames(gamesList) {
                const container = document.getElementById("game-grid");
                if (!container) return;

                container.innerHTML = "";

                if (!gamesList || gamesList.length === 0) {
                    container.innerHTML =
                        '<div class="no-results">No games found</div>';
                    return;
                }

                const grouped = groupGamesByCategory(gamesList);

                Object.keys(grouped).forEach((categoryName) => {
                    const gamesInCat = grouped[categoryName];
                    if (!gamesInCat || gamesInCat.length === 0) return;

                    const section = document.createElement("div");
                    section.className = "category-section";

                    const header = document.createElement("div");
                    header.className = "category-header";
                    header.innerHTML = `
              <span>${categoryName} (${gamesInCat.length})</span>
              <span class="toggle-icon">−</span>
            `;

                    const grid = document.createElement("div");
                    grid.className = "category-grid";

                    header.addEventListener("click", () => {
                        const isCollapsed = grid.classList.toggle("collapsed");
                        const icon = header.querySelector(".toggle-icon");
                        if (icon) {
                            icon.textContent = isCollapsed ? "+" : "−";
                        }
                    });

                    gamesInCat.forEach((game) => {
                        const name = game.name || game.title || "Untitled Game";
                        let imageSrc = game.icon || game.cover || "";
                        const gameLink = game.file || game.url || "#";

                        if (imageSrc.indexOf("/") === 0) {
                            imageSrc = imageSrc.substring(1);
                        }

                        const card = document.createElement("a");
                        card.className = "game-card";
                        card.href = "#";

                        card.innerHTML = `
                <img
                  src="${imageSrc}"
                  alt="${name}"
                  class="game-icon"
                  loading="lazy"
                  onerror="this.style.display='none';"
                />
                <h3 class="game-title">${name}</h3>
              `;

                        card.addEventListener("click", (e) => {
                            e.preventDefault();
                            openGame(name, gameLink);
                        });

                        grid.appendChild(card);
                    });

                    section.appendChild(header);
                    section.appendChild(grid);
                    container.appendChild(section);
                });
            }

            function applyFilters() {
                const searchInput = document.getElementById("search-input");
                const categorySelect =
                    document.getElementById("category-select");

                const query =
                    searchInput && searchInput.value
                        ? searchInput.value.toLowerCase().trim()
                        : "";
                const selectedCategory =
                    categorySelect && categorySelect.value
                        ? categorySelect.value
                        : "all";

                const matched = allGames.filter((game) => {
                    if (!game) return false;

                    const name = (game.name || game.title || "").toLowerCase();
                    const filePath = game.file || game.url || "";
                    const category = game.category || "";

                    const matchesSearch = !query || name.indexOf(query) !== -1;

                    let matchesCategory = true;
                    if (selectedCategory !== "all") {
                        if (selectedCategory === "astral") {
                            matchesCategory =
                                filePath.indexOf("games/gn-math/") === -1 &&
                                filePath.indexOf("games/ugs/") === -1;
                        } else {
                            const targetPath =
                                "games/" + selectedCategory + "/";
                            matchesCategory =
                                filePath.indexOf(targetPath) !== -1 ||
                                category === selectedCategory;
                        }
                    }

                    return matchesSearch && matchesCategory;
                });

                renderCategorizedGames(matched);
            }

            window.searchGames = function () {
                applyFilters();
            };

            window.changeCategory = function () {
                applyFilters();
            };

            async function loadAllGames() {
                try {
                    const astralResponse = await fetch("games/astral.json");
                    const astralGames = await astralResponse.json();

                    const gnMathResponse = await fetch(
                        "games/gn-math/gn-math.json",
                    );
                    const gnMathGames = await gnMathResponse.json();

                    const ugsResponse = await fetch("games/ugs/ugs.json");
                    const ugsGames = await ugsResponse.json();

                    allGames = [...astralGames, ...gnMathGames, ...ugsGames];

                    updateCategoryDropdown();
                    renderCategorizedGames(allGames);
                } catch (error) {
                    console.error("Error loading games:", error);
                }
            }

            function openGame(name, filePath) {
                const gameModal = document.getElementById("game-modal");
                const gameFrame = document.getElementById("game-frame");
                const gameTitle = document.getElementById("game-modal-title");

                if (!gameModal || !gameFrame || !gameTitle) return;

                activeGameFile = filePath;
                gameTitle.textContent = name;
                gameFrame.src = filePath;
                gameModal.classList.remove("hidden");
                document.body.style.overflow = "hidden";
            }

            function closeGame() {
                const gameModal = document.getElementById("game-modal");
                const gameFrame = document.getElementById("game-frame");

                if (gameModal) gameModal.classList.add("hidden");
                if (gameFrame) gameFrame.src = "";
                document.body.style.overflow = "";
            }

            document.addEventListener("DOMContentLoaded", () => {
                const searchInput = document.getElementById("search-input");
                const categorySelect =
                    document.getElementById("category-select");
                const closeBtn = document.getElementById("close-btn");
                const fullscreenBtn = document.getElementById("fullscreen-btn");
                const downloadBtn = document.getElementById("download-btn");

                if (searchInput)
                    searchInput.addEventListener("input", applyFilters);
                if (categorySelect)
                    categorySelect.addEventListener("change", applyFilters);
                if (closeBtn) closeBtn.addEventListener("click", closeGame);

                if (fullscreenBtn) {
                    fullscreenBtn.addEventListener("click", () => {
                        const gameFrame = document.getElementById("game-frame");
                        if (!gameFrame) return;

                        if (gameFrame.requestFullscreen) {
                            gameFrame.requestFullscreen();
                        } else if (gameFrame.webkitRequestFullscreen) {
                            gameFrame.webkitRequestFullscreen();
                        }
                    });
                }

                if (downloadBtn) {
                    downloadBtn.addEventListener("click", () => {
                        if (!activeGameFile) return;
                        const a = document.createElement("a");
                        a.href = activeGameFile;
                        a.download = activeGameFile.split("/").pop();
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    });
                }

                loadAllGames();
            });

            window.addEventListener("keydown", (e) => {
                const gameModal = document.getElementById("game-modal");
                if (
                    e.key === "Escape" &&
                    gameModal &&
                    !gameModal.classList.contains("hidden")
                ) {
                    closeGame();
                }
            });
        </script>
    </body>
</html>
