<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <base href="https://cdn.jsdelivr.net/gh/hyperfrog7/Astral@main/" />
        <title>Astral</title>
        <link rel="stylesheet" href="assets/css/style.css" />
        <link rel="icon" type="image/svg+xml" href="assets/media/logo.svg" />
        <script>
            window.openSettings = function () {
                const modal = document.getElementById("settings-modal");
                if (modal) modal.classList.remove("hidden");
            };

            window.closeSettings = function () {
                const modal = document.getElementById("settings-modal");
                if (modal) modal.classList.add("hidden");
            };
        </script>
    </head>
    <body>
        <div class="navbar">
            <div class="navbar-start">
                <img
                    width="48"
                    height="48"
                    src="assets/media/logo.svg"
                    alt="Astral Logo"
                />
                <h1 class="title">Astral</h1>
            </div>
            <div class="navbar-center">
                <div class="navbar-search">
                    <img
                        id="search-icon"
                        src="assets/media/search.svg"
                        alt="Search"
                    />
                    <input
                        id="search-input"
                        type="text"
                        placeholder="Search..."
                        oninput="searchGames()"
                    />
                    <div id="categoryDropdown">
                        <select
                            id="category-select"
                            onchange="changeCategory()"
                        >
                            <option value="all">All games</option>
                            <option value="astral">Astral</option>
                            <option value="gn-math">GN-Math</option>
                            <option value="ugs">UGS</option>
                            <option value="seraph">Seraph</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="navbar-end">
                <img
                    id="settings-icon"
                    src="assets/media/settings.svg"
                    alt="Settings"
                />
            </div>
        </div>

        <main class="game-grid" id="game-grid"></main>

        <div id="game-modal" class="game-modal hidden">
            <div class="game-modal-header">
                <span id="game-modal-title" class="game-modal-title"
                    >Game Title</span
                >
                <div class="game-modal-controls">
                    <button id="fullscreen-btn">Fullscreen</button>
                    <button id="cloak-game-btn">Open in new tab</button>
                    <button id="download-btn">Download</button>
                    <button id="close-btn">Close</button>
                </div>
            </div>
            <iframe
                id="game-frame"
                src=""
                frameborder="0"
                allowfullscreen
            ></iframe>
        </div>

        <div id="whats-new-modal" class="modal-overlay hidden">
            <div class="modal-card modal-card-wide">
                <div class="modal-header">
                    <h2>Astral</h2>
                    <span class="version-badge"></span>
                </div>

                <div class="modal-body-split">
                    <div id="version-sidebar" class="version-sidebar"></div>
                    <div class="version-content">
                        <p class="release-tagline"></p>
                        <ul class="changelog-list"></ul>
                    </div>
                </div>

                <div class="modal-footer">
                    <button id="close-whats-new-btn" class="modal-btn">
                        Explore Astral
                    </button>
                </div>
            </div>
        </div>

        <div id="settings-modal" class="settings-modal hidden">
            <div class="settings-content">
                <div class="settings-header">
                    <h2>Settings</h2>
                    <button
                        id="close-settings-btn"
                        class="close-btn settings-btn"
                    >
                        ✕
                    </button>
                </div>
                <div class="settings-body">
                    <div class="settings-option">
                        <span>Theme</span>
                        <select id="theme-select" class="settings-btn">
                            <option value="default">Astral (Default)</option>
                            <option value="crimson">Crimson</option>
                            <option value="forest">Forest</option>
                            <option value="amber">Amber</option>
                        </select>
                    </div>
                    <div class="settings-option">
                        <span>Tab Cloak</span>
                        <select id="cloak-preset-select" class="settings-btn">
                            <option value="default">Default (Astral)</option>
                            <option value="clever">Clever</option>
                            <option value="grades">Grades</option>
                            <option value="google">Google</option>
                            <option value="drive">Google Drive</option>
                            <option value="classroom">Google Classroom</option>
                            <option value="newtab">New Tab</option>
                        </select>
                    </div>
                    <div class="settings-option">
                        <span>Randomize Tab Cloak</span>
                        <input type="checkbox" id="random-cloak-checkbox" />
                    </div>
                    <div class="settings-option">
                        <span>Cloak Rotation Interval</span>
                        <select
                            id="random-cloak-interval-select"
                            class="settings-btn"
                        >
                            <option value="5000">5s</option>
                            <option value="10000">10s</option>
                            <option value="15000">15s</option>
                            <option value="30000">30s</option>
                            <option value="60000" selected>60s</option>
                        </select>
                    </div>
                    <div class="settings-option">
                        <span>Cloak Entire Site</span>
                        <button id="cloak-site-btn" class="settings-btn">
                            Launch in about:blank
                        </button>
                    </div>
                    <div class="settings-option">
                        <label for="panic-url-input">Panic URL</label>
                        <input
                            class="setting-input"
                            type="url"
                            id="panic-url-input"
                            placeholder="https://sonion.com"
                        />
                        <button id="save-panic-url-btn" class="settings-btn">
                            Save
                        </button>
                    </div>
                    <div class="settings-option">
                        <span>Auto about:blank</span>
                        <input type="checkbox" id="auto-cloak-checkbox" />
                    </div>
                </div>
            </div>
        </div>
        <script src="assets/js/script.js" defer></script>
    </body>
</html>
