<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position:fixed; top:0; left:0; width:100vw; height:100vh; margin:0; padding:0; border:none;">
  <foreignObject width="100%" height="100%">
    <iframe xmlns="http://www.w3.org/1999/xhtml" style="width:100vw; height:100vh; border:none; margin:0; padding:0;" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;/head&gt;&lt;body style='margin:0;padding:0;overflow:hidden;'&gt;&lt;div id='app-root'&gt;&lt;/div&gt;&lt;script&gt;(async function(){const c='https://cdn.jsdelivr.net/gh/hyperfrog7/Astral@main';try{const[css,html]=await Promise.all([fetch(c+'/style.css?t='+Date.now()).then(r=&gt;r.text()),fetch(c+'/index.html?t='+Date.now()).then(r=&gt;r.text())]);document.getElementById('app-root').innerHTML=html;const s=document.createElement('style');s.textContent=css;document.head.appendChild(s);const sc=document.createElement('script');sc.src=c+'/script.js?t='+Date.now();document.body.appendChild(sc);}catch(e){console.error('Failed to load assets',e);}})();&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
